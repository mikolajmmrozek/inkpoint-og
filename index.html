<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iOS "Add to Home Screen" uses the manifest's start_url, ignoring the current page.
      // Swap in the dashboard manifest so icons saved on /dashboard open that path.
      (function () {
        var path = window.location.pathname;
        var manifest = document.querySelector('link[rel="manifest"]');
        if (!manifest) return;
        if (path.indexOf('/dashboard') === 0) {
          manifest.setAttribute('href', '/manifest-dashboard.json');
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
